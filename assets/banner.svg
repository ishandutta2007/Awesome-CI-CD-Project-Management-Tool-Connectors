<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1138" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="orbGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="orbGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="wireGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>

    <!-- Keyframe Styles -->
    <style>
      @keyframes pulseOrb {
        0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
        50% { transform: scale(1.15) translate(-20px, 15px); opacity: 0.6; }
      }
      @keyframes floatNode {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes dashFlow {
        0% { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
      .orb-2 { animation: pulseOrb 10s ease-in-out infinite reverse; transform-origin: 1000px 300px; }
      .node-float { animation: floatNode 4s ease-in-out infinite; }
      .node-float-delayed { animation: floatNode 4.5s ease-in-out infinite 2s; }
      .flow-path { stroke-dasharray: 8 6; animation: dashFlow 3s linear infinite; }
      .flow-path-rev { stroke-dasharray: 8 6; animation: dashFlow 3s linear infinite reverse; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Animated Background Glow Orbs -->
  <circle class="orb-1" cx="220" cy="120" r="160" fill="url(#orbGrad1)" />
  <circle class="orb-2" cx="980" cy="280" r="180" fill="url(#orbGrad2)" />

  <!-- Dynamic Connecting Pipelines (Background Layer) -->
  <g opacity="0.6">
    <!-- Pipeline 1: CI to Middleware -->
    <path class="flow-path" d="M 120 330 C 260 330, 360 360, 600 360" fill="none" stroke="url(#wireGrad)" stroke-width="2.5" />
    <!-- Pipeline 2: Middleware to PM -->
    <path class="flow-path" d="M 600 360 C 840 360, 940 330, 1080 330" fill="none" stroke="url(#wireGrad)" stroke-width="2.5" />
    <!-- Top Return Flow -->
    <path class="flow-path-rev" d="M 1080 90 C 900 60, 700 80, 600 90 C 500 100, 300 70, 120 90" fill="none" stroke="url(#wireGrad)" stroke-width="1.5" stroke-opacity="0.5" />
  </g>

  <!-- Dynamic Floating Decorative Tech Pills (Side Embellishments) -->
  <g class="node-float" opacity="0.85">
    <!-- CI / Pipeline Node Left -->
    <rect x="70" y="295" width="140" height="46" rx="23" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="92" cy="318" r="6" fill="#38bdf8" filter="url(#glow)" />
    <text x="108" y="323" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">CI/CD Builds</text>

    <!-- Linear / Agile Node Right -->
    <rect x="990" y="295" width="140" height="46" rx="23" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" />
    <circle cx="1012" cy="318" r="6" fill="#c084fc" filter="url(#glow)" />
    <text x="1028" y="323" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Project Agile</text>
  </g>

  <g class="node-float-delayed" opacity="0.85">
    <!-- Automation Node Center-Bottom -->
    <rect x="525" y="337" width="150" height="46" rx="23" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <circle cx="547" cy="360" r="6" fill="#818cf8" filter="url(#glow)" />
    <text x="563" y="365" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Event Bridges</text>

    <!-- ChatOps Node Top-Right -->
    <rect x="940" y="65" width="150" height="38" rx="19" fill="#0f172a" stroke="#475569" stroke-width="1.2" />
    <circle cx="960" cy="84" r="5" fill="#10b981" />
    <text x="975" y="89" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">ChatOps &amp; Alerts</text>

    <!-- Webhook Node Top-Left -->
    <rect x="110" y="65" width="145" height="38" rx="19" fill="#0f172a" stroke="#475569" stroke-width="1.2" />
    <circle cx="130" cy="84" r="5" fill="#f59e0b" />
    <text x="145" y="89" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">Webhooks / Sync</text>
  </g>

  <!-- Foreground Category Badge -->
  <g>
    <rect x="495" y="55" width="210" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="512" cy="71" r="4" fill="#38bdf8" />
    <text x="524" y="76" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">AWESOME CONNECTORS</text>
  </g>

  <!-- Main Title & Subtitle in Clean Foreground -->
  <g text-anchor="middle">
    <!-- Main Title -->
    <text x="600" y="165" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      CI/CD &amp; Project Management
    </text>
    
    <!-- Gradient Accent Sub-header -->
    <text x="600" y="215" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" filter="url(#glow)">
      Tool Connectors &amp; Workflow Automations
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="265" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400">
      Curated ecosystem of SaaS iPaaS platforms, open-source pipeline orchestrators &amp; issue tracker bridges
    </text>
  </g>

  <!-- Outer Border Frame -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />
</svg>
